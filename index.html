<script>
/* ETAPA 2 — BASE + PROCESSOS + CLIENTES */
const LS='ff_controle_dados';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hojeISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtData=d=>d?d.split('-').reverse().join('/'):'—';
const fmtMoeda=v=>{v=parseFloat(String(v||'0').replace(/\./g,'').replace(',','.'))||0;return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const app={
data:null,editId:null,fichaId:null,
carregar(){
 try{const r=localStorage.getItem(LS);if(r)this.data=JSON.parse(r)}catch(e){this.data=null}
 if(!this.data||!Array.isArray(this.data.processos)){
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
   try{const v=JSON.parse(localStorage.getItem(k));
    if(v&&Array.isArray(v.processos)&&v.processos.length){this.data=v;break}}catch(e){}}
 }
 if(!this.data||!Array.isArray(this.data.processos))this.data={clientes:[],processos:[],andamentos:[],prazos:[],intimacoes:[],agenda:[],config:{roboUrl:'',roboProcessadas:[],escritorio:{nome:'Fabrício Freitas Advocacia',email:'freitas_advogados@yahoo.com.br',telefone:'(21) 2725-4167'}},listas:{}};
 const d=this.data;
 d.clientes=d.clientes||[];d.processos=d.processos||[];d.andamentos=d.andamentos||[];d.prazos=d.prazos||[];d.intimacoes=d.intimacoes||[];d.agenda=d.agenda||[];
 d.config=d.config||{};d.config.escritorio=d.config.escritorio||{nome:'Fabrício Freitas Advocacia',email:'freitas_advogados@yahoo.com.br',telefone:'(21) 2725-4167'};
 d.listas=d.listas||{};
 this.salvar();
},
salvar(){localStorage.setItem(LS,JSON.stringify(this.data))},
init(){
 this.carregar();
 document.getElementById('btnToggle').onclick=()=>{const sb=document.getElementById('sidebar');
  if(window.innerWidth<=900){sb.classList.toggle('expandido')}
  else{sb.classList.toggle('collapsed');document.getElementById('main').classList.toggle('expanded')}};
 document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>this.trocarAba(b.dataset.tab));
 this.relogio();setInterval(()=>this.relogio(),1000);
 this.renderDashboard();
},
trocarAba(t){document.querySelectorAll('section').forEach(s=>s.classList.remove('ativa'));
 document.getElementById('tab-'+t).classList.add('ativa');
 document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('ativo',b.dataset.tab===t));
 if(t==='dashboard')this.renderDashboard();
 if(t==='processos')this.renderProcessos();
 if(t==='arquivados')this.renderArquivados();
 if(t==='cadastro')this.renderClientes();
 if(window.innerWidth<=900)document.getElementById('sidebar').classList.remove('expandido')},
relogio(){const n=new Date();const dias=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];const p=x=>String(x).padStart(2,'0');
 document.getElementById('relogio').innerHTML='<small>'+dias[n.getDay()]+', '+p(n.getDate())+'/'+p(n.getMonth()+1)+'/'+n.getFullYear()+'</small>'+p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds())},
renderDashboard(){const d=this.data;
 document.getElementById('kpis').innerHTML=[
  ['Processos Ativos',d.processos.filter(p=>p.status!=='Arquivado').length,'azul'],
  ['Clientes',d.clientes.length,'roxo'],
  ['Andamentos',d.andamentos.length,'amarelo'],
  ['Prazos',d.prazos.length,'laranja']
 ].map(k=>'<div class="kpi '+k[2]+'"><div class="num">'+k[1]+'</div><div class="lbl">'+k[0]+'</div></div>').join('');
},
maskCNJ(v){v=v.replace(/\D/g,'').slice(0,20);let f=v.slice(0,7);if(v.length>7)f+='-'+v.slice(7,9);if(v.length>9)f+='.'+v.slice(9,13);if(v.length>13)f+='.'+v.slice(13,14);if(v.length>14)f+='.'+v.slice(14,16);if(v.length>16)f+='.'+v.slice(16,20);return f},
maskDoc(v){v=v.replace(/\D/g,'');if(v.length>11){v=v.slice(0,14);return v.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})/,(m,a,b,c,d,e)=>a+'.'+b+'.'+c+'/'+d+(e?'-'+e:''))}v=v.slice(0,11);return v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/,(m,a,b,c,d)=>a+'.'+b+'.'+c+(d?'-'+d:''))},
maskFone(v){v=v.replace(/\D/g,'').slice(0,11);if(v.length<=10)return v.replace(/(\d{2})(\d{4})(\d{0,4})/,(m,a,b,c)=>'('+a+') '+b+(c?'-'+c:''));return v.replace(/(\d{2})(\d{5})(\d{0,4})/,(m,a,b,c)=>'('+a+') '+b+(c?'-'+c:''))},
maskMoeda(v){v=v.replace(/\D/g,'');return v?(parseInt(v)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):''},
cliente(id){return this.data.clientes.find(c=>c.id===id)},
proc(id){return this.data.processos.find(p=>p.id===id)},
partes(p){const c=this.cliente(p.clienteId);return (c?c.nome:'—')+(p.parteContraria?' × '+p.parteContraria:'')},
val(id){const el=document.getElementById(id);return el?el.value.trim():''},
fechar(id){document.getElementById(id).classList.remove('aberto');this.editId=null},
renderProcessos(){const q=(document.getElementById('fProcBusca').value||'').toLowerCase();const fs=document.getElementById('fProcStatus').value;
const lista=this.data.processos.filter(p=>p.status!=='Arquivado').filter(p=>!fs||p.status===fs).filter(p=>!q||[p.numeroCNJ,this.partes(p),p.vara,p.comarca].join(' ').toLowerCase().includes(q));
document.getElementById('tblProcessos').innerHTML='<thead><tr><th>Nº CNJ</th><th>Cliente × Parte</th><th>Ação</th><th>Tribunal</th><th>Comarca/Vara</th><th>Fase</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+
(lista.length?lista.map(p=>'<tr><td><a href="#" onclick="app.verFicha(\''+p.id+'\');return false" style="color:var(--azul);font-weight:700">'+esc(p.numeroCNJ)+'</a></td><td>'+esc(this.partes(p))+'</td><td>'+esc(p.tipoAcao||'—')+'</td><td>'+esc(p.tribunal||'—')+'</td><td>'+esc(p.comarca||'—')+'<br><small>'+esc(p.vara||'')+'</small></td><td>'+esc(p.fase||'—')+'</td><td><span class="badge '+(p.status==='Ativo'?'b-verde':'b-amarelo')+'">'+esc(p.status)+'</span></td><td><button class="btn mini" onclick="app.verFicha(\''+p.id+'\')">Ficha</button> <button class="btn mini sec" onclick="app.modalProc(\''+p.id+'\')">Editar</button> <button class="btn mini sec" onclick="app.arquivar(\''+p.id+'\')">Arquivar</button></td></tr>').join(''):'<tr><td colspan="8" style="text-align:center;color:var(--cinza);padding:2rem">Nenhum processo encontrado.</td></tr>')+'</tbody>'},
renderArquivados(){const q=(document.getElementById('fArqBusca').value||'').toLowerCase();
const lista=this.data.processos.filter(p=>p.status==='Arquivado').filter(p=>!q||[p.numeroCNJ,this.partes(p)].join(' ').toLowerCase().includes(q));
document.getElementById('tblArquivados').innerHTML='<thead><tr><th>Nº CNJ</th><th>Cliente × Parte</th><th>Ação</th><th>Arquivado em</th><th>Ações</th></tr></thead><tbody>'+
(lista.length?lista.map(p=>'<tr><td>'+esc(p.numeroCNJ)+'</td><td>'+esc(this.partes(p))+'</td><td>'+esc(p.tipoAcao||'—')+'</td><td>'+fmtData(p.dataArquivamento)+'</td><td><button class="btn mini green" onclick="app.reativar(\''+p.id+'\')">Reativar</button></td></tr>').join(''):'<tr><td colspan="5" style="text-align:center;color:var(--cinza);padding:2rem">Nenhum processo arquivado.</td></tr>')+'</tbody>'},
modalProc(id){this.editId=id||null;const d=this.data;
const sel=document.getElementById('pCliente');
sel.innerHTML='<option value="">(selecione)</option>'+d.clientes.map(c=>'<option value="'+c.id+'">'+esc((c.tratamento?c.tratamento+' ':'')+c.nome)+'</option>').join('');
const set=(k,v)=>{document.getElementById(k).value=v||''};
if(id){const p=this.proc(id);document.getElementById('mdProcTitulo').textContent='Editar Processo';
 set('pCNJ',p.numeroCNJ);set('pCliente',p.clienteId);set('pPolo',p.polo);set('pParte',p.parteContraria);set('pAcao',p.tipoAcao);set('pTribunal',p.tribunal);set('pComarca',p.comarca);set('pVara',p.vara);set('pFase',p.fase);set('pStatus',p.status);set('pValor',p.valorCausa);set('pAdv',p.advogado);set('pObs',p.obs)}
else{document.getElementById('mdProcTitulo').textContent='Novo Processo';['pCNJ','pCliente','pPolo','pParte','pAcao','pTribunal','pComarca','pVara','pFase','pValor','pAdv','pObs'].forEach(k=>set(k,''));document.getElementById('pStatus').value='Ativo'}
document.getElementById('mdProcesso').classList.add('aberto')},
salvarProcesso(){if(!this.val('pCNJ')||!this.val('pCliente')){alert('Preencha o Número CNJ e o Cliente.');return}
const rec={numeroCNJ:this.val('pCNJ'),clienteId:this.val('pCliente'),polo:this.val('pPolo'),parteContraria:this.val('pParte'),tipoAcao:this.val('pAcao'),tribunal:this.val('pTribunal'),comarca:this.val('pComarca'),vara:this.val('pVara'),fase:this.val('pFase'),status:this.val('pStatus')||'Ativo',valorCausa:this.val('pValor'),advogado:this.val('pAdv'),obs:this.val('pObs')};
if(this.editId){Object.assign(this.proc(this.editId),rec)}
else{this.data.processos.push(Object.assign({id:uid(),despesas:[],honorariosLancamentos:[],destaques:[],dataCadastro:hojeISO(),dataArquivamento:null},rec))}
this.salvar();this.fechar('mdProcesso');this.renderProcessos()},
arquivar(id){const p=this.proc(id);if(confirm('Arquivar o processo '+p.numeroCNJ+'?')){p.status='Arquivado';p.dataArquivamento=hojeISO();this.salvar();this.renderProcessos()}},
reativar(id){const p=this.proc(id);p.status='Ativo';p.dataArquivamento=null;this.salvar();this.renderArquivados()},
verFicha(id){const p=this.proc(id);if(!p)return;this.fichaId=id;const c=this.cliente(p.clienteId);
const ands=this.data.andamentos.filter(a=>a.processoId===id).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
const przs=this.data.prazos.filter(z=>z.processoId===id);
let html='<div class="ficha-top"><div class="cnj-big">'+esc(p.numeroCNJ)+'</div><div style="font-size:.85rem;margin-top:.2rem">'+esc(c?(c.tratamento?c.tratamento+' ':'')+c.nome:'—')+(p.parteContraria?' × '+esc(p.parteContraria):'')+'</div><div class="badges"><span class="badge">'+esc(p.status||'Ativo')+'</span><span class="badge">'+esc(p.tipoAcao||'—')+'</span><span class="badge">'+esc(p.tribunal||'—')+'</span></div></div>';
html+='<div class="subcard"><h4>Dados do Processo</h4><div class="fgrid">'+
[['Comarca',p.comarca],['Vara / Cartório',p.vara],['Fase',p.fase],['Polo',p.polo],['Advogado',p.advogado],['Valor da Causa',p.valorCausa?fmtMoeda(p.valorCausa):'—']].map(x=>'<div><small style="color:var(--cinza);font-weight:700">'+x[0]+'</small><div>'+esc(x[1]||'—')+'</div></div>').join('')+'</div>'+(p.obs?'<div style="margin-top:.6rem;font-size:.82rem"><strong>Obs.:</strong> '+esc(p.obs)+'</div>':'')+'</div>';
html+='<div class="subcard"><h4>Andamentos ('+ands.length+')</h4>'+(ands.length?ands.map(a=>'<div style="padding:.4rem 0;border-bottom:1px dashed var(--borda);font-size:.82rem"><strong>'+fmtData(a.data)+'</strong> · '+esc(a.tipo)+'<br>'+esc(a.descricao)+'</div>').join(''):'<div style="color:var(--cinza);font-size:.82rem">Nenhum andamento registrado.</div>')+'</div>';
html+='<div class="subcard"><h4>Prazos ('+przs.length+')</h4>'+(przs.length?przs.map(z=>'<div style="font-size:.82rem;padding:.3rem 0">👉 <strong>'+esc(z.motivo||'—')+'</strong></div>').join(''):'<div style="color:var(--cinza);font-size:.82rem">Nenhum prazo cadastrado.</div>')+'</div>';
document.getElementById('fichaConteudo').innerHTML=html;document.getElementById('mdFicha').classList.add('aberto')},
renderClientes(){const d=this.data;
document.getElementById('tblClientes').innerHTML='<thead><tr><th>Nome</th><th>CPF/CNPJ</th><th>Cidade</th><th>Telefone</th><th>Processos</th><th>Ações</th></tr></thead><tbody>'+
(d.clientes.length?d.clientes.map(c=>'<tr><td>'+esc((c.tratamento?c.tratamento+' ':'')+c.nome)+'</td><td>'+esc(c.doc||'—')+'</td><td>'+esc(c.cidade||'—')+'</td><td>'+esc(c.telefone||'—')+'</td><td>'+d.processos.filter(p=>p.clienteId===c.id).length+'</td><td><button class="btn mini sec" onclick="app.modalCli(\''+c.id+'\')">Editar</button> <button class="btn mini danger" onclick="app.excluirCliente(\''+c.id+'\')">Excluir</button></td></tr>').join(''):'<tr><td colspan="6" style="text-align:center;color:var(--cinza);padding:2rem">Nenhum cliente cadastrado.</td></tr>')+'</tbody>'},
modalCli(id){this.editId=id||null;const set=(k,v)=>{document.getElementById(k).value=v||''};
if(id){const c=this.cliente(id);document.getElementById('mdCliTitulo').textContent='Editar Cliente';
 set('cTrat',c.tratamento);set('cNome',c.nome);set('cDoc',c.doc);set('cCidade',c.cidade);set('cFone',c.telefone)}
else{document.getElementById('mdCliTitulo').textContent='Novo Cliente';['cTrat','cNome','cDoc','cCidade','cFone'].forEach(k=>set(k,''))}
document.getElementById('mdCliente').classList.add('aberto')},
salvarCliente(){if(!this.val('cNome')){alert('Preencha o nome do cliente.');return}
const rec={tratamento:this.val('cTrat'),nome:this.val('cNome'),doc:this.val('cDoc'),cidade:this.val('cCidade'),telefone:this.val('cFone')};
if(this.editId){Object.assign(this.cliente(this.editId),rec)}else{this.data.clientes.push(Object.assign({id:uid()},rec))}
this.salvar();this.fechar('mdCliente');this.renderClientes()},
excluirCliente(id){if(!confirm('Excluir este cliente? Os processos vinculados permanecem, mas ficarão sem cliente.'))return;
this.data.clientes=this.data.clientes.filter(c=>c.id!==id);this.salvar();this.renderClientes()}
};
app.init();
</script>
</body>
</html>
